AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Candate voter data layer for account 402275401617 in us-east-1.
  Filings table, Form 2 ingest, a separate users table, and a Cognito
  email sign-in pool. Does not create Amplify Hosting. Optionally attaches
  a managed policy to an existing Amplify SSR compute role.

Parameters:
  TableName:
    Type: String
    Default: candate-voter
    AllowedPattern: "[a-zA-Z0-9_.-]{3,255}"
    Description: DynamoDB table name. The Next.js app reads CANDATE_TABLE_NAME.
  FecApiKey:
    Type: String
    NoEcho: true
    MinLength: 1
    Description: >
      api.data.gov key sent as api_key. DEMO_KEY is the public demo key
      (about 10 calls per hour). A free key allows 1,000 calls per hour.
      Do not commit this value.
  ScheduleExpression:
    Type: String
    Default: rate(6 hours)
    AllowedPattern: ^(rate\(.+\)|cron\(.+\))$
    Description: EventBridge schedule. rate(6 hours) keeps filings within hours.
  UsersTableName:
    Type: String
    Default: candate-voter-users
    AllowedPattern: "[a-zA-Z0-9_.-]{3,255}"
    Description: DynamoDB table for follows and alert preferences. Not the filings table.
  AmplifyComputeRoleName:
    Type: String
    Default: ""
    AllowedPattern: "^$|[A-Za-z0-9+=,.@_-]{1,64}"
    Description: >
      Optional name of the existing Amplify SSR compute role. When set, this
      stack's compute policy is attached to it. The policy name is generated.
      Leave empty and attach output AmplifyComputePolicyArn yourself.
  GoogleClientId:
    Type: String
    Default: ""
    NoEcho: true
    Description: Google OAuth client id. Leave empty to deploy without Google sign-in.
  GoogleClientSecret:
    Type: String
    Default: ""
    NoEcho: true
    Description: Google OAuth client secret. Leave empty to deploy without Google sign-in.

Conditions:
  AttachAmplifyPolicy: !Not [!Equals [!Ref AmplifyComputeRoleName, ""]]
  HasGoogle: !And
    - !Not [!Equals [!Ref GoogleClientId, ""]]
    - !Not [!Equals [!Ref GoogleClientSecret, ""]]

Resources:
  VoterTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: false
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: candate
        - Key: Component
          Value: voter-data

  FecIngestLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/candate-voter-fec-ingest
      RetentionInDays: 30

  FecIngestFunction:
    Type: AWS::Serverless::Function
    DependsOn: FecIngestLogGroup
    Properties:
      FunctionName: candate-voter-fec-ingest
      Description: Upsert FEC electronic Form 2 filings into the Candate table.
      CodeUri: ../
      Handler: workers/fec-ingest/app.handler
      Runtime: nodejs22.x
      Architectures:
        - arm64
      Timeout: 900
      MemorySize: 512
      LoggingConfig:
        LogGroup: !Ref FecIngestLogGroup
      Environment:
        Variables:
          CANDATE_TABLE_NAME: !Ref TableName
          FEC_API_KEY: !Ref FecApiKey
          FEC_API_BASE_URL: https://api.open.fec.gov/v1
          FEC_MIN_DELAY_MS: "250"
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:Query
              Resource:
                - !GetAtt VoterTable.Arn
                - !Sub "${VoterTable.Arn}/index/gsi1"
      Events:
        EverySixHours:
          Type: Schedule
          Properties:
            Schedule: !Ref ScheduleExpression
            Description: Pull new FEC Form 2 e-filings into the Candate table.
            Enabled: true
      Tags:
        Project: candate
        Component: voter-data
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - workers/fec-ingest/app.ts
        Target: es2022
        Format: cjs
        Platform: node
        Minify: false
        Sourcemap: true

  FecTotalsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/candate-voter-fec-totals
      RetentionInDays: 30

  FecTotalsFunction:
    Type: AWS::Serverless::Function
    DependsOn: FecTotalsLogGroup
    Properties:
      FunctionName: candate-voter-fec-totals
      Description: >
        Upsert OpenFEC candidate totals, committee report periods, and
        Schedule E aggregates. Does not itemize Schedule A or Schedule E lines.
      CodeUri: ../
      Handler: workers/fec-totals/app.handler
      Runtime: nodejs22.x
      Architectures:
        - arm64
      Timeout: 900
      MemorySize: 512
      LoggingConfig:
        LogGroup: !Ref FecTotalsLogGroup
      Environment:
        Variables:
          CANDATE_TABLE_NAME: !Ref TableName
          FEC_API_KEY: !Ref FecApiKey
          FEC_API_BASE_URL: https://api.open.fec.gov/v1
          FEC_MIN_DELAY_MS: "250"
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:Query
              Resource:
                - !GetAtt VoterTable.Arn
                - !Sub "${VoterTable.Arn}/index/gsi1"
      Events:
        EverySixHours:
          Type: Schedule
          Properties:
            Schedule: !Ref ScheduleExpression
            Description: Refresh FEC totals and Schedule E aggregates.
            Enabled: true
      Tags:
        Project: candate
        Component: voter-data
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - workers/fec-totals/app.ts
        Target: es2022
        Format: cjs
        Platform: node
        Minify: false
        Sourcemap: true

  UsersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref UsersTableName
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: false
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: candate
        - Key: Component
          Value: accounts

  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: candate-voter
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      UsernameConfiguration:
        CaseSensitive: false
      MfaConfiguration: "OFF"
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      UserPoolTags:
        Project: candate
        Component: accounts

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: candate-voter-402275401617
      UserPoolId: !Ref UserPool

  GoogleProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: HasGoogle
    Properties:
      ProviderName: Google
      ProviderType: Google
      UserPoolId: !Ref UserPool
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: email openid profile
      AttributeMapping:
        email: email
        username: sub

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: candate-voter-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      SupportedIdentityProviders: !If
        - HasGoogle
        - - COGNITO
          - !Ref GoogleProvider
        - - COGNITO
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - email
        - openid
        - profile
      CallbackURLs:
        - https://main.d253xhq1uabld3.amplifyapp.com/sign-in/google
        - https://voter.naijei.com/sign-in/google
        - http://localhost:3000/sign-in/google
      LogoutURLs:
        - https://main.d253xhq1uabld3.amplifyapp.com/
        - https://voter.naijei.com/
        - http://localhost:3000/
      IdTokenValidity: 1
      AccessTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        IdToken: hours
        AccessToken: hours
        RefreshToken: days

  MediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub candate-voter-media-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - PUT
              - GET
              - HEAD
            AllowedOrigins:
              - https://voter.naijei.com
              - http://localhost:3000
            MaxAge: 300
      Tags:
        - Key: Project
          Value: candate
        - Key: Component
          Value: brand-media

  AmplifyComputePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: >-
        Amplify SSR access for accounts, site copy, brand images, and correction review.
        Does not grant DeleteItem on filing rows.
      Roles: !If
        - AttachAmplifyPolicy
        - - !Ref AmplifyComputeRoleName
        - !Ref AWS::NoValue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: UsersTableReadWrite
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
            Resource: !GetAtt UsersTable.Arn
          - Sid: SaveCorrections
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:Query
            Resource: !GetAtt VoterTable.Arn
            Condition:
              ForAllValues:StringLike:
                dynamodb:LeadingKeys:
                  - "CORRECTION#*"
                  - "CONTENT#*"
                  - "CHECK#*"
          - Sid: BrandMedia
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
            Resource: !Sub ${MediaBucket.Arn}/brand/*
          - Sid: ListCorrections
            Effect: Allow
            Action:
              - dynamodb:Query
            Resource: !Sub "${VoterTable.Arn}/index/gsi1"
            Condition:
              ForAllValues:StringEquals:
                dynamodb:LeadingKeys:
                  - CORRECTIONS

Outputs:
  TableName:
    Description: DynamoDB table. Set this as CANDATE_TABLE_NAME.
    Value: !Ref VoterTable
  TableArn:
    Description: Table ARN for a later Amplify SSR read policy.
    Value: !GetAtt VoterTable.Arn
  IngestFunctionName:
    Description: Scheduled Form 2 ingest function.
    Value: !Ref FecIngestFunction
  IngestFunctionArn:
    Value: !GetAtt FecIngestFunction.Arn
  TotalsFunctionName:
    Description: Scheduled FEC totals and Schedule E aggregate function.
    Value: !Ref FecTotalsFunction
  LogGroupName:
    Value: !Ref FecIngestLogGroup
  UsersTableName:
    Description: Set this as CANDATE_USERS_TABLE on Amplify.
    Value: !Ref UsersTable
  UserPoolId:
    Description: Set this as COGNITO_USER_POOL_ID on Amplify.
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Public app client id. Set this as COGNITO_CLIENT_ID. There is no client secret.
    Value: !Ref UserPoolClient
  CognitoHostedDomain:
    Description: Set COGNITO_DOMAIN to this host, without https, after Google is configured.
    Value: candate-voter-402275401617.auth.us-east-1.amazoncognito.com
  AmplifyComputePolicyArn:
    Description: Attach to the Amplify SSR compute role when AmplifyComputeRoleName was left empty.
    Value: !Ref AmplifyComputePolicy
  MediaBucketName:
    Description: Set this as CANDATE_MEDIA_BUCKET on Amplify. Do not set AWS_REGION.
    Value: !Ref MediaBucket
