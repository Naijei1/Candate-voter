version: 1
# Amplify Hosting compute (platform WEB_COMPUTE) for Next.js SSR.
# artifacts.baseDirectory must stay `.next`.
# Do not set `output: "export"` in next.config — that would publish a static site.
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - node -v
        - npm ci
    build:
      commands:
        # Console env vars are in this shell, but WEB_COMPUTE does not pass
        # them to Next.js server components. Next loads .env.production when
        # it serves traffic. Copy only names the site reads. Never copy
        # FEC_API_KEY. An unset CANDATE_TABLE_NAME still falls back to
        # candate-voter in tableNameFromEnv.
        - rm -f .env.production
        - env | grep -e '^CANDATE_TABLE_NAME=' -e '^CANDATE_CYCLES=' -e '^NEXT_PUBLIC_' >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
