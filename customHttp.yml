customHeaders:
  - pattern: '/photos/**'
    headers:
      - key: Cache-Control
        value: public, max-age=86400, stale-while-revalidate=604800
  - pattern: '/video/**'
    headers:
      - key: Cache-Control
        value: public, max-age=86400, stale-while-revalidate=604800
  - pattern: '/geo/**'
    headers:
      - key: Cache-Control
        value: public, max-age=86400, stale-while-revalidate=604800
